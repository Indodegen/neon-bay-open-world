<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NEON BAY — a complete 3D open-world crime game set in the original coastal city of Coral Bay. Drive, chase, and race across the bay bridge.">
<link rel="icon" href="data:,">
<title>NEON BAY — Coral Bay Open World</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1026;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif; color: #fff; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-size: 14px; }
  #hud-top-left { position: absolute; top: 14px; left: 14px; }
  #mission-panel { background: rgba(8,12,20,.78); border-left: 4px solid #ffd166; padding: 10px 14px;
    border-radius: 4px; max-width: 420px; box-shadow: 0 2px 12px rgba(0,0,0,.45); }
  #mission-title { font-weight: 800; letter-spacing: 2px; font-size: 15px; color: #ffd166; }
  #mission-objective { font-size: 13px; color: #e8ecf2; margin-top: 3px; line-height: 1.35; }
  #mission-progress { height: 5px; background: rgba(255,255,255,.15); border-radius: 3px; margin-top: 7px; overflow: hidden; }
  #mission-progress-fill { display: none; height: 100%; width: 0%; background: #ffd166; }
  #mission-dist { font-size: 12px; color: #9fd4ff; margin-top: 4px; font-weight: 700; }
  #hud-top-right { position: absolute; top: 14px; right: 16px; text-align: right; }
  #stars { font-size: 26px; letter-spacing: 3px; text-shadow: 0 0 8px rgba(0,0,0,.7); }
  #stars .star { color: rgba(255,255,255,.25); }
  #stars .star.on { color: #ffd166; text-shadow: 0 0 10px #ffb347; }
  #clock-weather { margin-top: 2px; font-weight: 700; font-size: 15px; text-shadow: 0 1px 4px #000; }
  #clock-weather #weather { color: #9fd4ff; margin-left: 10px; font-size: 13px; }
  #radio-box { margin-top: 6px; background: rgba(8,12,20,.72); padding: 5px 10px; border-radius: 4px; display: inline-block; }
  #radio-name { font-weight: 800; font-size: 13px; }
  #radio-desc { display: block; font-size: 11px; color: #b8c2d0; }
  #hud-bottom-left { position: absolute; left: 14px; bottom: 14px; }
  #minimap { border-radius: 50%; border: 3px solid rgba(255,209,102,.9); box-shadow: 0 0 0 3px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.6); background: #0a0e14; display: block; }
  #weapon-box { margin-top: 8px; background: rgba(8,12,20,.78); padding: 6px 12px; border-radius: 4px; display: inline-block; }
  #weapon-name { font-weight: 800; letter-spacing: 1px; }
  #weapon-ammo { color: #ffd166; font-weight: 700; margin-left: 10px; }
  #hud-bottom-right { position: absolute; right: 16px; bottom: 14px; text-align: right; }
  #cash { font-size: 30px; font-weight: 800; color: #4dff6b; text-shadow: 0 2px 6px #000; letter-spacing: 1px; }
  #speedo { font-size: 34px; font-weight: 800; text-shadow: 0 2px 6px #000; margin-top: 2px; }
  #speed-unit { font-size: 12px; color: #b8c2d0; margin-left: 4px; }
  #veh-cond { display: none; align-items: center; gap: 8px; margin-top: 6px; justify-content: flex-end; }
  #veh-cond > div { width: 150px; height: 7px; background: rgba(255,255,255,.18); border-radius: 4px; overflow: hidden; }
  #veh-cond-fill { height: 100%; width: 100%; background: #4dff6b; }
  #veh-cond-label { font-size: 11px; font-weight: 700; color: #dfe6ef; }
  #hud-bottom-center { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: 260px; }
  #hp-bar, #armor-bar { height: 12px; background: rgba(0,0,0,.55); border-radius: 6px; overflow: hidden; position: relative; margin-top: 5px; }
  #hp-fill, #armor-fill { height: 100%; width: 100%; }
  #hp-fill { background: #4dff6b; } #armor-fill { background: #7fd4ff; }
  #hp-bar span, #armor-bar span { position: absolute; right: 6px; top: 0; font-size: 9px; font-weight: 800; color: #fff; line-height: 12px; text-shadow: 0 1px 2px #000; }
  #police-list { position: absolute; top: 150px; right: 16px; background: rgba(8,12,20,.78); border: 1px solid rgba(255,80,80,.4);
    border-radius: 4px; padding: 8px 10px; min-width: 250px; display: none; }
  .police-head { font-weight: 800; color: #ff6b6b; letter-spacing: 2px; font-size: 12px; margin-bottom: 5px; }
  .police-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 2px 0; color: #e8ecf2; }
  .police-row .st-PURSUIT { color: #ff6b6b; font-weight: 800; }
  .police-row .st-RAMMING { color: #ff2222; font-weight: 800; }
  .police-row .st-BOXINGIN { color: #ffb347; font-weight: 800; }
  .police-row .st-SEARCHLIGHT { color: #7fd4ff; font-weight: 800; }
  #dialog { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%) translateY(20px); width: 620px; max-width: 82vw;
    background: rgba(8,12,20,.88); border: 1px solid rgba(255,209,102,.5); border-radius: 8px; padding: 12px;
    display: none; gap: 12px; align-items: flex-start; opacity: 0; transition: opacity .25s, transform .25s; }
  #dialog.show { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
  #dialog-portrait { width: 96px; height: 106px; border-radius: 6px; object-fit: cover; border: 2px solid rgba(255,255,255,.25); }
  #dialog-name { font-weight: 800; font-size: 15px; margin-bottom: 4px; }
  #dialog-text { font-size: 14px; line-height: 1.5; color: #eef1f6; }
  #dialog-hint { margin-top: 7px; font-size: 11px; color: #9aa6b5; }
  #notifications { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); width: 480px; text-align: center; }
  .notif { background: rgba(8,12,20,.85); border-left: 4px solid #ffd166; border-radius: 4px; padding: 8px 14px; margin-top: 6px;
    box-shadow: 0 2px 10px rgba(0,0,0,.5); transition: opacity .5s; }
  .notif b { display: block; letter-spacing: 2px; font-size: 13px; color: #ffd166; }
  .notif span { font-size: 13px; color: #e8ecf2; }
  .notif.out { opacity: 0; }
  #counters { position: absolute; left: 250px; bottom: 18px; font-size: 12px; font-weight: 700; color: #dfe6ef; text-shadow: 0 1px 3px #000; display: flex; gap: 14px; }
  #interact-prompt { position: absolute; left: 50%; bottom: 210px; transform: translateX(-50%); background: rgba(8,12,20,.85);
    border: 1px solid rgba(255,255,255,.35); padding: 7px 14px; border-radius: 4px; font-weight: 700; display: none; }
  #toast { position: absolute; left: 50%; bottom: 260px; transform: translateX(-50%); background: rgba(8,12,20,.9);
    padding: 8px 16px; border-radius: 4px; font-weight: 700; opacity: 0; transition: opacity .3s; }
  #toast.show { opacity: 1; }
  #screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(5,8,16,.72); backdrop-filter: blur(3px); z-index: 20; pointer-events: auto; }
  #screen.show { display: flex; }
  /* Garage docks its panel to the left on a lighter veil so the upgraded
     car behind it stays visible on the right of the frame. */
  #screen.screen-garage { justify-content: flex-start; background: rgba(5,8,16,.45); backdrop-filter: blur(1px); }
  #screen.screen-garage .screen-inner { margin: auto 0 auto 36px; max-width: 560px; text-align: left; }
  .screen-inner { max-width: 860px; width: 92vw; max-height: 92vh; overflow-y: auto; background: rgba(10,14,24,.96);
    border: 1px solid rgba(255,209,102,.45); border-radius: 10px; padding: 28px 34px; text-align: center; box-shadow: 0 10px 60px rgba(0,0,0,.7); }
  .big-title { font-size: 44px; font-weight: 900; letter-spacing: 6px; }
  .big-title.gold { color: #ffd166; text-shadow: 0 0 24px rgba(255,179,71,.5); }
  .big-title.red { color: #ff3b30; text-shadow: 0 0 24px rgba(255,59,48,.5); }
  .big-sub { font-size: 16px; color: #c8d2de; margin-top: 6px; }
  .big-pay { font-size: 30px; font-weight: 900; color: #4dff6b; margin-top: 14px; }
  .big-hint { margin-top: 18px; font-size: 13px; color: #9aa6b5; }
  .title-logo { font-size: 84px; font-weight: 900; letter-spacing: 8px; line-height: 1;
    background: linear-gradient(180deg, #ffe9a8, #ff8a4d 55%, #ff2e88); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 60px rgba(255,46,136,.35); }
  .title-logo span { color: transparent; }
  .title-tag { letter-spacing: 4px; font-size: 13px; color: #9fd4ff; margin-top: 8px; }
  .title-menu { margin: 26px auto 0; text-align: left; width: 380px; font-size: 16px; font-weight: 700; }
  .title-item { padding: 8px 12px; border-radius: 4px; color: #c8d2de; }
  .title-item.sel { background: rgba(255,209,102,.16); color: #ffd166; }
  .title-controls { margin-top: 24px; font-size: 12px; color: #8b96a5; line-height: 1.7; }
  .title-foot { margin-top: 10px; font-size: 11px; color: #5f6a7a; }
  .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; text-align: left; }
  .panel-grid > div { background: rgba(255,255,255,.06); border-radius: 6px; padding: 10px 14px; }
  .panel-grid b { display: block; font-size: 11px; letter-spacing: 2px; color: #9aa6b5; }
  .panel-grid span { font-size: 17px; font-weight: 700; }
  .shop-row { display: flex; gap: 14px; align-items: center; text-align: left; background: rgba(255,255,255,.05);
    border-radius: 6px; padding: 11px 14px; margin-top: 8px; font-size: 14px; }
  .shop-row b { min-width: 150px; }
  .shop-row span:nth-child(2) { flex: 1; color: #b8c2d0; font-size: 13px; }
  .shop-row span:nth-child(3) { color: #ffd166; font-weight: 800; }
  .shop-row span:nth-child(4) { color: #7fd4ff; font-weight: 700; font-size: 12px; }
  .map-wrap { display: flex; gap: 20px; margin-top: 16px; text-align: left; }
  #map-canvas { border-radius: 8px; border: 2px solid rgba(255,209,102,.5); }
  .map-side { flex: 1; }
  .map-pct { font-size: 20px; font-weight: 900; color: #ffd166; }
  .map-list { margin-top: 10px; font-size: 13px; line-height: 1.9; color: #dfe6ef; }
  .map-mission.done { color: #4dff6b; }
  .map-legend { margin-top: 12px; font-size: 12px; color: #9aa6b5; }
  .map-stats { margin-top: 8px; font-size: 13px; color: #e8ecf2; }
  .briefing-wrap { display: flex; gap: 22px; text-align: left; align-items: flex-start; }
  .briefing-portrait { width: 180px; height: 200px; border-radius: 8px; border: 2px solid rgba(255,209,102,.5); object-fit: cover; }
  .briefing-text { margin-top: 12px; font-size: 15px; line-height: 1.6; color: #e8ecf2; }
  #cutscene-bars { position: fixed; inset: 0; pointer-events: none; z-index: 15; display: none; }
  #cutscene-bars.show { display: block; }
  #cutscene-bars .bar { position: absolute; left: 0; right: 0; height: 9vh; background: #000; }
  #cutscene-bars .bar.top { top: 0; } #cutscene-bars .bar.bottom { bottom: 0; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0b1026; z-index: 50; font-size: 18px; letter-spacing: 3px; color: #ffd166; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<div id="loading">LOADING NEON BAY…</div>
<script src="vendor/three.min.js"></script>
<script type="module" src="src/main.js"></script>
<script>
  // Hide the loading veil once the game has booted a few frames.
  const iv = setInterval(() => {
    if (window.__booted) { const l = document.getElementById('loading'); if (l) l.remove(); clearInterval(iv); }
  }, 200);
  setTimeout(() => { const l = document.getElementById('loading'); if (l) l.remove(); }, 9000);
</script>
</body>
</html>
